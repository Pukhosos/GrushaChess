repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: native-c-tests
        name: native-c-tests
        entry: pytest tests/native/ -n 8
        language: system
        pass_filenames: false
        always_run: true

      - id: infinite-tests
        name: infinite-tests
        entry: pytest tests/infinite -n 8 --limit-infinite-tests
        language: system
        pass_filenames: false
        always_run: true
